<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Controle de Processos</title>
  <meta name="theme-color" content="#090d16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    summary::-webkit-details-marker { display: none; }
    summary { list-style: none; }
    details[open] > summary .chevron-icon { transform: rotate(180deg); }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans pb-20 sm:pb-8 min-h-screen">

  <!-- Header -->
  <header class="bg-slate-900/90 backdrop-blur border-b border-slate-800 sticky top-0 z-30 shadow-lg">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between">
      <div>
        <h1 class="font-bold text-lg text-slate-100 leading-tight">Meus Processos</h1>
        <p class="text-xs text-slate-400">Monitoramento Judicial</p>
      </div>
      <div class="flex items-center gap-2">
        <button id="btnSync" onclick="sincronizarDataJud()" title="Consultar DataJud Agora" 
          class="bg-amber-600 hover:bg-amber-500 text-white font-medium px-3 py-1.5 rounded-lg text-xs sm:text-sm flex items-center gap-1 shadow transition">
          <span id="syncIcon">⚡</span> <span id="syncText">Checar DataJud</span>
        </button>
        <button onclick="openConfigModal()" title="Configurações" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700">
          ⚙️
        </button>
        <button onclick="openProcessModal()" class="bg-blue-600 hover:bg-blue-500 text-white font-medium px-3 py-1.5 rounded-lg text-xs sm:text-sm flex items-center gap-1 shadow">
          <span>+</span> Novo
        </button>
      </div>
    </div>
  </header>

  <!-- Filtro e Busca -->
  <main class="max-w-4xl mx-auto px-4 py-4 space-y-4">
    <div class="flex gap-2">
      <input type="text" id="searchInput" oninput="renderProcessos()" placeholder="Buscar por número, tipo, apelido, partes, vara ou tribunal..." 
        class="w-full px-3 py-2 bg-slate-900 border border-slate-800 text-slate-100 rounded-lg text-sm placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500 shadow-sm">
      <button onclick="carregarProcessos()" title="Atualizar Lista" class="px-3 py-2 bg-slate-900 border border-slate-800 rounded-lg text-sm hover:bg-slate-800 shadow-sm text-slate-300">
        🔄
      </button>
    </div>

    <!-- Lista de Processos Agrupados por Tipo -->
    <div id="processosContainer" class="space-y-3">
      <div class="text-center py-12 text-slate-500 text-sm">Carregando processos...</div>
    </div>
  </main>

  <!-- Modal: Adicionar/Editar Processo -->
  <div id="processModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-slate-900 border border-slate-800 w-full sm:max-w-lg rounded-t-2xl sm:rounded-2xl p-5 shadow-2xl max-h-[90vh] overflow-y-auto">
      <h3 id="modalTitle" class="text-base font-bold text-slate-100 mb-4">Novo Processo</h3>
      <form id="processForm" onsubmit="salvarProcesso(event)" class="space-y-3">
        <input type="hidden" id="formMode" value="add">
        
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Número do Processo (CNJ)*</label>
          <input type="text" id="campoProcesso" required oninput="aoDigitarProcesso(this.value)" placeholder="0000000-00.0000.0.00.0000"
            class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-lg text-sm text-slate-100 placeholder-slate-600 focus:ring-2 focus:ring-blue-500 outline-none font-mono">
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Apelido/Identificador</label>
            <input type="text" id="campoApelido" placeholder="Ex: Causa Cível"
              class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-lg text-sm text-slate-100 placeholder-slate-600 focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Tribunal (Automático)</label>
            <input type="text" id="campoTribunal" placeholder="TJCE, TRF5..."
              class="w-full px-3 py-2 bg-slate-950/60 border border-slate-800 rounded-lg text-sm text-slate-300 placeholder-slate-600 focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
        </div>

        <!-- Tipo e Status -->
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Tipo de Processo</label>
            <select id="campoTipo" class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-lg text-sm text-slate-100 focus:ring-2 focus:ring-blue-500 outline-none">
              <option value="Cível">Cível</option>
              <option value="Trabalhista">Trabalhista</option>
              <option value="Criminal">Criminal</option>
              <option value="Tributário">Tributário</option>
              <option value="Previdenciário">Previdenciário</option>
              <option value="Eleitoral">Eleitoral</option>
              <option value="Outro">Outro</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Status</label>
            <select id="campoStatus" class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-lg text-sm text-slate-100 focus:ring-2 focus:ring-blue-500 outline-none">
              <option value="Ativo">Ativo</option>
              <option value="Arquivado">Arquivado</option>
              <option value="Suspenso">Suspenso</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Reclamante (Autor)</label>
            <input type="text" id="campoReclamante" placeholder="DataJud ou manual"
              class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-lg text-sm text-slate-100 placeholder-slate-600 focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Reclamado (Réu)</label>
            <input type="text" id="campoReclamado" placeholder="DataJud ou manual"
              class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-lg text-sm text-slate-100 placeholder-slate-600 focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Vara / Unidade Judiciária</label>
          <input type="text" id="campoVara" placeholder="Ex: 2ª Vara Cível de Fortaleza"
            class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-lg text-sm text-slate-100 placeholder-slate-600 focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">E-mail de Notificação</label>
          <input type="email" id="campoEmail" placeholder="seu@email.com"
            class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-lg text-sm text-slate-100 placeholder-slate-600 focus:ring-2 focus:ring-blue-500 outline-none">
        </div>

        <div class="flex justify-end gap-2 pt-4">
          <button type="button" onclick="closeProcessModal()" class="px-4 py-2 border border-slate-700 rounded-lg text-sm font-medium text-slate-300 hover:bg-slate-800">Cancelar</button>
          <button type="submit" id="btnSubmitForm" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-sm font-medium shadow">Salvar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal: Movimentações -->
  <div id="movModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-slate-900 border border-slate-800 w-full sm:max-w-2xl rounded-t-2xl sm:rounded-2xl p-5 shadow-2xl max-h-[85vh] flex flex-col">
      <div class="flex items-start justify-between pb-3 border-b border-slate-800 gap-2">
        <div class="flex-1">
          <h3 class="text-base font-bold text-slate-100" id="movProcessoTitulo">Movimentações</h3>
          <div class="flex items-center gap-2 mt-1">
            <span class="text-xs text-slate-400 font-mono" id="movProcessoSubtitulo"></span>
            <button onclick="copiarProcesso(document.getElementById('movProcessoSubtitulo').innerText)" 
              class="text-[11px] bg-slate-800 hover:bg-slate-700 text-slate-300 px-2 py-0.5 rounded border border-slate-700 transition">
              📋 Copiar
            </button>
          </div>
          <div id="movLinkTribunalContainer" class="mt-2.5 flex items-center gap-2 flex-wrap"></div>
        </div>
        <button onclick="closeMovModal()" class="text-slate-400 hover:text-slate-200 text-lg font-bold p-1">✕</button>
      </div>
      <div id="movimentacoesLista" class="overflow-y-auto py-3 space-y-3 flex-1 pr-1">
        <p class="text-center text-xs text-slate-500 py-6">Carregando movimentações...</p>
      </div>
    </div>
  </div>

  <!-- Modal: Configuração da API -->
  <div id="configModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-2xl p-5 shadow-2xl">
      <h3 class="text-base font-bold text-slate-100 mb-2">Configurar URL da API</h3>
      <p class="text-xs text-slate-400 mb-3">Cole a URL de implantação terminada em <code>/exec</code>:</p>
      <input type="text" id="apiUrlInput" placeholder="https://script.google.com/macros/s/.../exec"
        class="w-full px-3 py-2 bg-slate-950 border border-slate-800 rounded-lg text-xs font-mono text-slate-200 focus:ring-2 focus:ring-blue-500 outline-none mb-4">
      <div class="flex justify-end gap-2">
        <button onclick="closeConfigModal()" class="px-4 py-2 border border-slate-700 rounded-lg text-sm font-medium text-slate-300">Fechar</button>
        <button onclick="salvarApiUrl()" class="px-4 py-2 bg-blue-600 hover:bg-blue-500 text-white rounded-lg text-sm font-medium">Salvar</button>
      </div>
    </div>
  </div>

  <script>
    const DEFAULT_API_URL = "SUA_URL_DO_WEBAPP_AQUI";
    let API_URL = localStorage.getItem("PROCESSOS_API_URL") || DEFAULT_API_URL;
    let processosData = [];

    window.addEventListener("DOMContentLoaded", () => {
      if (!API_URL || API_URL === "SUA_URL_DO_WEBAPP_AQUI") {
        openConfigModal();
      } else {
        carregarProcessos();
      }
    });

    async function apiRequest(action, data = null, method = "GET") {
      const url = method === "GET" 
        ? `${API_URL}?action=${encodeURIComponent(action)}${data ? '&' + new URLSearchParams(data).toString() : ''}`
        : API_URL;

      const opts = { method, redirect: "follow" };
      if (method === "POST") {
        opts.headers = { "Content-Type": "text/plain;charset=utf-8" };
        opts.body = JSON.stringify({ action, ...data });
      }

      const res = await fetch(url, opts);
      return await res.json();
    }

    async function carregarProcessos() {
      const container = document.getElementById("processosContainer");
      container.innerHTML = `<div class="text-center py-12 text-slate-500 text-sm">Carregando processos...</div>`;
      try {
        const res = await apiRequest("list");
        if (res.success) {
          processosData = res.data;
          renderProcessos();
        } else {
          container.innerHTML = `<div class="text-center text-red-400 text-sm py-4">Erro ao carregar: ${res.error}</div>`;
        }
      } catch (err) {
        container.innerHTML = `<div class="text-center text-red-400 text-sm py-4">Falha na conexão com a API. Verifique a URL nas configurações.</div>`;
      }
    }

    function calcularDiasDesde(dataStr) {
      if (!dataStr) return "Sem data";
      const dataMov = new Date(dataStr);
      if (isNaN(dataMov.getTime())) return "Sem data";
      
      const hoje = new Date();
      const hojeZero = new Date(hoje.getFullYear(), hoje.getMonth(), hoje.getDate()).getTime();
      const movZero = new Date(dataMov.getFullYear(), dataMov.getMonth(), dataMov.getDate()).getTime();
      
      const diffMs = hojeZero - movZero;
      const diffDias = Math.floor(diffMs / (1000 * 60 * 60 * 24));

      if (diffDias <= 0) return "Hoje";
      if (diffDias === 1) return "Há 1 dia";
      return `Há ${diffDias} dias`;
    }

    function copiarProcesso(texto) {
      navigator.clipboard.writeText(texto.trim()).then(() => {
        alert("Número copiado para a área de transferência!");
      });
    }

    function obterLinksTribunal(numProcesso, tribunal) {
      const d = String(numProcesso).replace(/\D/g, "");
      const trib = String(tribunal || "").toUpperCase().trim();
      const links = [];

      if (d.length === 20) {
        const numDigAno = `${d.slice(0, 7)}-${d.slice(7, 9)}.${d.slice(9, 13)}`;
        const j = d.slice(13, 14);
        const tr = d.slice(14, 16);
        const foro = d.slice(16, 20);
        const cnjFormatado = `${numDigAno}.${j}.${tr}.${foro}`;

        if (trib === "TJCE") {
          links.push({
            nome: "e-SAJ TJCE (1º Grau)",
            url: `https://esaj.tjce.jus.br/cpopg/search.do?cbPesquisa=NUMPROC&dadosConsulta.tipoNuProcesso=UNIFICADO&numeroDigitoAnoUnificado=${encodeURIComponent(numDigAno)}&foroNumeroUnificado=${encodeURIComponent(foro)}&dadosConsulta.valorConsultaNuUnificado=${encodeURIComponent(cnjFormatado)}`
          });
          links.push({
            nome: "e-SAJ TJCE (2º Grau)",
            url: `https://esaj.tjce.jus.br/cposg/search.do?cbPesquisa=NUMPROC&dadosConsulta.tipoNuProcesso=UNIFICADO&numeroDigitoAnoUnificado=${encodeURIComponent(numDigAno)}&foroNumeroUnificado=${encodeURIComponent(foro)}&dadosConsulta.valorConsultaNuUnificado=${encodeURIComponent(cnjFormatado)}`
          });
          links.push({
            nome: "PJe TJCE",
            url: "https://pje.tjce.jus.br/pje/ConsultaPublica/listView.seam"
          });
        } else if (trib === "TJSP") {
          links.push({
            nome: "e-SAJ TJSP (1º Grau)",
            url: `https://esaj.tjsp.jus.br/cpopg/search.do?cbPesquisa=NUMPROC&dadosConsulta.tipoNuProcesso=UNIFICADO&numeroDigitoAnoUnificado=${encodeURIComponent(numDigAno)}&foroNumeroUnificado=${encodeURIComponent(foro)}&dadosConsulta.valorConsultaNuUnificado=${encodeURIComponent(cnjFormatado)}`
          });
        } else if (trib.startsWith("TRF")) {
          const numReg = trib.replace("TRF", "");
          links.push({
            nome: `PJe ${trib}`,
            url: `https://pje.trf${numReg}.jus.br/pje/ConsultaPublica/listView.seam`
          });
        } else if (trib.startsWith("TRT")) {
          const numReg = trib.replace("TRT", "");
          links.push({
            nome: `PJe ${trib}`,
            url: `https://pje.trt${numReg}.jus.br/consultaprocessual/detalhe-processo/${encodeURIComponent(cnjFormatado)}`
          });
        }
      }

      links.push({
        nome: "CNJ (Comunica PJe)",
        url: `https://comunica.pje.jus.br/consulta?numeroUnico=${d}`
      });

      return links;
    }

    function renderProcessos() {
      const query = document.getElementById("searchInput").value.toLowerCase();
      const container = document.getElementById("processosContainer");
      
      const filtrados = processosData.filter(p => 
        (p.processo || '').toLowerCase().includes(query) ||
        (p.apelido || '').toLowerCase().includes(query) ||
        (p.tribunal || '').toLowerCase().includes(query) ||
        (p.tipo || '').toLowerCase().includes(query) ||
        (p.reclamante || '').toLowerCase().includes(query) ||
        (p.reclamado || '').toLowerCase().includes(query) ||
        (p.vara || '').toLowerCase().includes(query)
      );

      if (filtrados.length === 0) {
        container.innerHTML = `<div class="bg-slate-900 p-8 rounded-xl border border-slate-800 text-center text-slate-500 text-sm">Nenhum processo encontrado.</div>`;
        return;
      }

      // Agrupa os processos por Tipo
      const grupos = {};
      filtrados.forEach(p => {
        const tipo = (p.tipo && p.tipo.trim()) ? p.tipo.trim() : "Cível";
        if (!grupos[tipo]) grupos[tipo] = [];
        grupos[tipo].push(p);
      });

      // Ordenação das categorias
      const ordemTipos = ["Trabalhista", "Cível", "Criminal", "Tributário", "Previdenciário", "Eleitoral", "Outro"];
      const tiposOrdenados = Object.keys(grupos).sort((a, b) => {
        const idxA = ordemTipos.indexOf(a);
        const idxB = ordemTipos.indexOf(b);
        if (idxA !== -1 && idxB !== -1) return idxA - idxB;
        if (idxA !== -1) return -1;
        if (idxB !== -1) return 1;
        return a.localeCompare(b);
      });

      // Renderiza cada grupo como uma guia sanfonada que abre ao clicar
      container.innerHTML = tiposOrdenados.map(tipo => {
        const listaDoTipo = grupos[tipo];

        // Ordena os processos do mais novo para o mais antigo com base na última data
        listaDoTipo.sort((a, b) => {
          const tA = a.ultimaData ? new Date(a.ultimaData).getTime() : 0;
          const tB = b.ultimaData ? new Date(b.ultimaData).getTime() : 0;
          return tB - tA;
        });

        const total = listaDoTipo.length;

        // Ícone de cada tipo
        let icone = "📁";
        const tLow = tipo.toLowerCase();
        if (tLow.includes("trabalh")) icone = "💼";
        else if (tLow.includes("crim")) icone = "🚨";
        else if (tLow.includes("tribut")) icone = "🏛️";
        else if (tLow.includes("previd")) icone = "🛡️";
        else if (tLow.includes("cív") || tLow.includes("civ")) icone = "⚖️";
        else if (tLow.includes("eleit")) icone = "🗳️";

        const htmlProcessos = listaDoTipo.map(p => {
          const tempoDesde = calcularDiasDesde(p.ultimaData);
          const dataFormatada = p.ultimaData ? new Date(p.ultimaData).toLocaleDateString('pt-BR') : 'Sem registro';
          const linksTribunal = obterLinksTribunal(p.processo, p.tribunal);
          const linkPrincipal = linksTribunal[0];

          return `
          <details class="group/item bg-slate-950 border border-slate-800/80 hover:border-slate-700 rounded-xl overflow-hidden transition shadow-sm mb-2.5">
            <summary class="cursor-pointer select-none p-3.5 sm:p-4 flex items-center justify-between gap-3 bg-slate-950 group-hover/item:bg-slate-900/50">
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-1.5 flex-wrap mb-1">
                  <span class="text-sm font-bold text-slate-100 truncate">${p.apelido || 'Sem apelido'}</span>
                  ${p.tribunal ? `<span class="px-1.5 py-0.5 text-[10px] font-semibold rounded bg-blue-950 text-blue-400 border border-blue-800/60">${p.tribunal}</span>` : ''}
                </div>
                <p class="text-xs text-slate-400 font-mono truncate select-all">${p.processo}</p>
              </div>

              <div class="flex items-center gap-2.5 flex-shrink-0">
                <span class="px-2.5 py-1 text-xs font-medium rounded-full bg-slate-800 text-slate-300 border border-slate-700/80">
                  ⏱️ ${tempoDesde}
                </span>
                <svg class="chevron-icon w-4 h-4 text-slate-400 transition-transform duration-200" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
                </svg>
              </div>
            </summary>

            <div class="px-4 pb-4 pt-2 border-t border-slate-800/80 bg-slate-900/40 space-y-3">
              <div class="flex items-center justify-between flex-wrap gap-2">
                <div class="flex items-center gap-2">
                  <span class="px-2 py-0.5 text-xs font-semibold rounded ${
                    p.status === 'Ativo' ? 'bg-emerald-950 text-emerald-400 border border-emerald-800/60' : 'bg-slate-800 text-slate-400'
                  }">${p.status || 'Ativo'}</span>
                  <span class="text-[11px] text-slate-400">Última data: <strong class="text-slate-200">${dataFormatada}</strong></span>
                </div>
                <div class="flex items-center gap-1">
                  <button onclick='event.stopPropagation(); abrirEditar(${JSON.stringify(p)})' 
                    class="p-1.5 text-slate-400 hover:text-blue-400 hover:bg-slate-800 rounded-md text-xs transition">✏️ Editar</button>
                  <button onclick='event.stopPropagation(); excluirProcesso("${p.processo}")' 
                    class="p-1.5 text-slate-400 hover:text-red-400 hover:bg-slate-800 rounded-md text-xs transition">🗑️ Excluir</button>
                </div>
              </div>

              <!-- Dados Cadastrais: Reclamante, Reclamado e Vara -->
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs bg-slate-900/80 border border-slate-800 p-2.5 rounded-lg">
                <div class="sm:col-span-2">
                  <span class="text-slate-500 font-semibold">🏛️ Vara:</span> 
                  <span class="text-slate-200">${p.vara || '<span class="text-slate-500 italic">Não informada</span>'}</span>
                </div>
                <div>
                  <span class="text-slate-500 font-semibold">👤 Reclamante:</span> 
                  <span class="text-slate-200">${p.reclamante || '<span class="text-slate-500 italic">Não informado</span>'}</span>
                </div>
                <div>
                  <span class="text-slate-500 font-semibold">🏢 Reclamado:</span> 
                  <span class="text-slate-200">${p.reclamado || '<span class="text-slate-500 italic">Não informado</span>'}</span>
                </div>
              </div>

              <!-- Rodapé da Guia com Link e Histórico -->
              <div class="flex items-center justify-between pt-1 border-t border-slate-850 flex-wrap gap-2">
                <div class="flex items-center gap-3">
                  <span class="text-xs text-slate-500 truncate max-w-[180px]" title="${p.email || ''}">✉️ ${p.email || 'Sem e-mail'}</span>
                  <a href="${linkPrincipal.url}" target="_blank" onclick="event.stopPropagation()"
                    class="text-xs text-blue-400 hover:text-blue-300 underline font-medium">
                    🔗 Abrir no ${linkPrincipal.nome}
                  </a>
                </div>
                <button onclick='event.stopPropagation(); verMovimentacoes("${p.processo}", "${p.apelido || p.processo}", "${p.tribunal || ""}")' 
                  class="text-xs font-semibold text-blue-400 hover:text-blue-300 transition">
                  Ver Histórico Completo →
                </button>
              </div>
            </div>
          </details>
          `;
        }).join('');

        return `
        <details class="group bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-md transition">
          <summary class="cursor-pointer select-none px-4 py-3.5 flex items-center justify-between bg-slate-900 hover:bg-slate-850 border-b border-transparent group-open:border-slate-800 transition">
            <div class="flex items-center gap-2.5">
              <span class="text-lg">${icone}</span>
              <span class="font-bold text-sm text-slate-100">${tipo}</span>
              <span class="px-2.5 py-0.5 text-xs font-semibold rounded-full bg-slate-800 text-slate-300 border border-slate-700/80">
                ${total} ${total === 1 ? 'processo' : 'processos'}
              </span>
            </div>
            <div class="flex items-center gap-2">
              <span class="text-xs text-slate-500 group-open:hidden">Abrir lista</span>
              <svg class="chevron-icon w-4 h-4 text-slate-400 transition-transform duration-200" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
              </svg>
            </div>
          </summary>
          <div class="p-3 bg-slate-950/40">
            ${htmlProcessos}
          </div>
        </details>
        `;
      }).join('');
    }

    async function sincronizarDataJud() {
      const btn = document.getElementById("btnSync");
      const icon = document.getElementById("syncIcon");
      const txt = document.getElementById("syncText");

      btn.disabled = true;
      btn.classList.add("opacity-60", "cursor-not-allowed");
      icon.classList.add("animate-spin");
      txt.innerText = "Consultando...";

      try {
        const res = await apiRequest("sync", {}, "POST");
        if (res.success) {
          await carregarProcessos();
          alert("Verificação concluída com sucesso!");
        } else {
          alert("Erro: " + res.error);
        }
      } catch (err) {
        alert("Erro ao conectar com a API.");
      } finally {
        btn.disabled = false;
        btn.classList.remove("opacity-60", "cursor-not-allowed");
        icon.classList.remove("animate-spin");
        txt.innerText = "Checar DataJud";
      }
    }

    async function salvarProcesso(e) {
      e.preventDefault();
      const mode = document.getElementById("formMode").value;
      const btn = document.getElementById("btnSubmitForm");
      btn.innerText = "Salvando...";
      btn.disabled = true;

      const payload = {
        processo: document.getElementById("campoProcesso").value.trim(),
        apelido: document.getElementById("campoApelido").value.trim(),
        tribunal: document.getElementById("campoTribunal").value.trim(),
        tipo: document.getElementById("campoTipo").value,
        reclamante: document.getElementById("campoReclamante").value.trim(),
        reclamado: document.getElementById("campoReclamado").value.trim(),
        vara: document.getElementById("campoVara").value.trim(),
        email: document.getElementById("campoEmail").value.trim(),
        status: document.getElementById("campoStatus").value
      };

      try {
        const res = await apiRequest(mode, payload, "POST");
        if (res.success) {
          closeProcessModal();
          await carregarProcessos();
        } else {
          alert("Erro: " + res.error);
        }
      } catch (err) {
        alert("Erro ao salvar processo.");
      } finally {
        btn.innerText = "Salvar";
        btn.disabled = false;
      }
    }

    async function excluirProcesso(numProcesso) {
      if (!confirm(`Deseja realmente remover o processo ${numProcesso}?`)) return;
      try {
        const res = await apiRequest("delete", { processo: numProcesso }, "POST");
        if (res.success) {
          await carregarProcessos();
        } else {
          alert("Erro ao excluir: " + res.error);
        }
      } catch (err) {
        alert("Erro na requisição.");
      }
    }

    async function verMovimentacoes(numProcesso, titulo, tribunal) {
      document.getElementById("movProcessoTitulo").innerText = titulo;
      document.getElementById("movProcessoSubtitulo").innerText = numProcesso;
      
      const linkContainer = document.getElementById("movLinkTribunalContainer");
      const links = obterLinksTribunal(numProcesso, tribunal);
      
      linkContainer.innerHTML = links.map(l => `
        <a href="${l.url}" target="_blank" 
          class="inline-flex items-center gap-1 text-[11px] text-blue-400 hover:text-blue-300 bg-blue-950/60 border border-blue-800/80 px-2 py-1 rounded-md transition font-medium">
          <span>🔗</span> ${l.nome}
        </a>
      `).join('');

      const lista = document.getElementById("movimentacoesLista");
      lista.innerHTML = `<p class="text-center text-xs text-slate-500 py-6">Carregando...</p>`;
      document.getElementById("movModal").classList.remove("hidden");

      try {
        const res = await apiRequest("movimentacoes", { processo: numProcesso });
        if (res.success && res.data.length > 0) {
          const ordenados = [...res.data].sort((a, b) => {
            const dataA = a.dataMovimentacao ? new Date(a.dataMovimentacao).getTime() : 0;
            const dataB = b.dataMovimentacao ? new Date(b.dataMovimentacao).getTime() : 0;
            return dataB - dataA;
          });

          lista.innerHTML = ordenados.map(m => `
            <div class="border-l-2 border-blue-500 pl-3 py-1.5 space-y-1 bg-slate-950/30 rounded-r-lg">
              <span class="text-[10px] font-semibold text-slate-400 block font-mono">
                📅 ${m.dataMovimentacao ? new Date(m.dataMovimentacao).toLocaleString('pt-BR') : '-'}
              </span>
              <p class="text-xs text-slate-200 leading-relaxed whitespace-pre-line">${m.atualizacao}</p>
            </div>
          `).join('');
        } else {
          lista.innerHTML = `<p class="text-center text-xs text-slate-500 py-6">Nenhuma movimentação registrada na planilha.</p>`;
        }
      } catch (err) {
        lista.innerHTML = `<p class="text-center text-xs text-red-400 py-6">Erro ao buscar movimentações.</p>`;
      }
    }

    function extrairTribunalETipo(processo) {
      const digitos = processo.replace(/\D/g, "");
      if (digitos.length < 16) return { tribunal: "", tipo: "" };

      const j = digitos.substring(13, 14);
      const tr = digitos.substring(14, 16);
      let tribunal = "";
      let tipo = "Cível";

      if (j === "1") tribunal = "STF";
      if (j === "2") tribunal = "CNJ";
      if (j === "3") tribunal = "STJ";
      if (j === "4") tribunal = `TRF${parseInt(tr, 10)}`;
      if (j === "5") {
        tribunal = `TRT${parseInt(tr, 10)}`;
        tipo = "Trabalhista";
      }
      if (j === "6") {
        tribunal = tr === "00" ? "TSE" : `TRE-${tr}`;
        tipo = "Eleitoral";
      }
      if (j === "7") tribunal = "STM";

      if (j === "8") {
        const tjs = {
          "01": "TJAC", "02": "TJAL", "03": "TJAP", "04": "TJAM",
          "05": "TJBA", "06": "TJCE", "07": "TJDFT", "08": "TJES",
          "09": "TJGO", "10": "TJMA", "11": "TJMT", "12": "TJMS",
          "13": "TJMG", "14": "TJPA", "15": "TJPB", "16": "TJPR",
          "17": "TJPE", "18": "TJPI", "19": "TJRJ", "20": "TJRN",
          "21": "TJRS", "22": "TJRO", "23": "TJRR", "24": "TJSC",
          "25": "TJSE", "26": "TJSP", "27": "TJTO"
        };
        tribunal = tjs[tr] || `TJ-${tr}`;
      }
      if (j === "9") tribunal = "TJM";

      return { tribunal, tipo };
    }

    function aoDigitarProcesso(valor) {
      const { tribunal, tipo } = extrairTribunalETipo(valor);
      if (tribunal) document.getElementById("campoTribunal").value = tribunal;
      if (tipo) document.getElementById("campoTipo").value = tipo;
    }

    function openProcessModal() {
      document.getElementById("processForm").reset();
      document.getElementById("formMode").value = "add";
      document.getElementById("modalTitle").innerText = "Novo Processo";
      document.getElementById("campoProcesso").readOnly = false;
      document.getElementById("processModal").classList.remove("hidden");
    }

    function abrirEditar(p) {
      document.getElementById("formMode").value = "edit";
      document.getElementById("modalTitle").innerText = "Editar Processo";
      document.getElementById("campoProcesso").value = p.processo;
      document.getElementById("campoProcesso").readOnly = true;
      document.getElementById("campoApelido").value = p.apelido || "";
      document.getElementById("campoTribunal").value = p.tribunal || "";
      document.getElementById("campoTipo").value = p.tipo || "Cível";
      document.getElementById("campoReclamante").value = p.reclamante || "";
      document.getElementById("campoReclamado").value = p.reclamado || "";
      document.getElementById("campoVara").value = p.vara || "";
      document.getElementById("campoEmail").value = p.email || "";
      document.getElementById("campoStatus").value = p.status || "Ativo";
      document.getElementById("processModal").classList.remove("hidden");
    }

    function closeProcessModal() {
      document.getElementById("processModal").classList.add("hidden");
    }

    function closeMovModal() {
      document.getElementById("movModal").classList.add("hidden");
    }

    function openConfigModal() {
      document.getElementById("apiUrlInput").value = API_URL === "SUA_URL_DO_WEBAPP_AQUI" ? "" : API_URL;
      document.getElementById("configModal").classList.remove("hidden");
    }

    function closeConfigModal() {
      document.getElementById("configModal").classList.add("hidden");
    }

    function salvarApiUrl() {
      const val = document.getElementById("apiUrlInput").value.trim();
      if (!val) return;
      API_URL = val;
      localStorage.setItem("PROCESSOS_API_URL", val);
      closeConfigModal();
      carregarProcessos();
    }
  </script>
