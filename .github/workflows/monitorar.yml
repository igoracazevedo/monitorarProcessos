name: Monitorar Processos DataJud

on:
  schedule:
    # Roda de segunda a sexta, às 09:00, 13:00 e 18:00 (Horário de Brasília / UTC-3)
    - cron: '0 12,16,21 * * 1-5'
  workflow_dispatch: # Permite disparar o teste manualmente pelo GitHub

jobs:
  executar-monitoramento:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          pip install requests

      - name: Executar script de consulta
        env:
          # Variáveis salvas em: Settings > Secrets and variables > Actions
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py
